<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Klondike Solitaire</title>
  <link rel="stylesheet" href="styles.css?v=13" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
  <style>
    .hidden { display: none !important; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d7a4f; color: #fff; min-height: 100vh; }
    .overlay-screen { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 5000; backdrop-filter: blur(4px); }
    .overlay-screen.hidden { display: none !important; }
    .panel { background: #fff; color: #1a1a1a; border-radius: 16px; padding: 28px 32px; width: min(420px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; }
    .panel h1 { color: #0d7a4f; margin: 0 0 4px; font-size: 1.8rem; }
    .panel h2 { color: #0d7a4f; margin: 0 0 12px; }
    .panel .sub { color: #666; margin: 0 0 16px; }
    .diff-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    .diff-list button { display: block; width: 100%; text-align: left; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px; background: #fafafa; cursor: pointer; font-size: 1rem; font-family: inherit; }
    .diff-list button:hover { border-color: #0d7a4f; background: #f0faf5; }
    .diff-list button strong { display: block; color: #0d7a4f; font-size: 1.1rem; pointer-events: none; }
    .diff-list button span { color: #555; font-size: 0.82rem; pointer-events: none; line-height: 1.35; }
    .btn { border: none; border-radius: 8px; padding: 10px 20px; font-weight: 600; cursor: pointer; font-size: 0.95rem; margin: 4px; font-family: inherit; }
    .btn-primary { background: #0d7a4f; color: #fff; }
    .btn-primary:hover { background: #0a5c3c; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-link { background: none; border: none; color: #0d7a4f; text-decoration: underline; cursor: pointer; padding: 8px; font-family: inherit; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .card .corner.bottom { display: none !important; }
    .card .corner, .card .corner.top { position: absolute !important; top: 5px !important; left: 7px !important; align-items: flex-start !important; }
  </style>
</head>
<body>
  <div id="start-screen" class="overlay-screen">
    <div class="panel">
      <h1>♠ Solitaire ♥</h1>
      <p class="sub">Klondike · v13</p>
      <div class="diff-list">
        <button type="button" data-diff="easy">
          <strong>Easy</strong>
          <span>Draw 1 card · Unlimited stock passes · Unlimited undos · Best for learning</span>
        </button>
        <button type="button" data-diff="medium">
          <strong>Medium</strong>
          <span>Draw 3 cards (only the top waste card is playable) · Unlimited passes &amp; undos</span>
        </button>
        <button type="button" data-diff="hard">
          <strong>Hard</strong>
          <span>Draw 3 · Only top waste card · Max 3 stock passes · Only 3 undos</span>
        </button>
      </div>
      <p id="highscores" style="font-size:0.85rem;color:#666;margin:12px 0 8px;line-height:1.5"></p>
      <button type="button" id="open-tutorial-start" class="btn-link">How to play</button>
    </div>
  </div>
  <div id="game-app" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button type="button" id="menu-btn" class="icon-btn" title="Menu">☰</button>
        <span class="title">Solitaire</span>
      </div>
      <div class="topbar-right">
        <button type="button" id="pause-btn" class="icon-btn" title="Pause">⏸</button>
        <button type="button" id="undo" class="btn btn-secondary" disabled>Undo</button>
        <button type="button" id="hint-btn" class="btn btn-secondary">Hint</button>
        <button type="button" id="auto-btn" class="btn btn-finish hidden">Finish</button>
        <div class="stats">
          <span id="timer">00:00</span>
          <span>Moves <b id="moves">0</b></span>
          <span>Score <b id="score">0</b></span>
        </div>
      </div>
    </header>
    <main class="board">
      <div class="top-row">
        <div class="stock-waste">
          <div id="stock" class="pile stock" title="Draw"></div>
          <div id="waste" class="pile waste"></div>
        </div>
        <div class="foundations">
          <div id="foundation-0" class="pile foundation" data-suit="♠"></div>
          <div id="foundation-1" class="pile foundation" data-suit="♥"></div>
          <div id="foundation-2" class="pile foundation" data-suit="♦"></div>
          <div id="foundation-3" class="pile foundation" data-suit="♣"></div>
        </div>
      </div>
      <div class="tableau">
        <div id="tableau-0" class="pile tableau-col"></div>
        <div id="tableau-1" class="pile tableau-col"></div>
        <div id="tableau-2" class="pile tableau-col"></div>
        <div id="tableau-3" class="pile tableau-col"></div>
        <div id="tableau-4" class="pile tableau-col"></div>
        <div id="tableau-5" class="pile tableau-col"></div>
        <div id="tableau-6" class="pile tableau-col"></div>
      </div>
    </main>
    <div id="pass-info" class="pass-info hidden"></div>
  </div>
  <div id="pause-screen" class="overlay-screen hidden">
    <div class="panel">
      <h2>Paused</h2>
      <button type="button" id="resume-btn" class="btn btn-primary">Resume</button>
      <button type="button" id="new-from-pause" class="btn btn-secondary">New Game</button>
      <button type="button" id="tutorial-from-pause" class="btn-link">Tutorial</button>
    </div>
  </div>
  <div id="win-modal" class="overlay-screen hidden">
    <div class="panel">
      <h2>You Win! 🎉</h2>
      <div id="win-stats" style="margin-bottom:16px;line-height:1.6;color:#444"></div>
      <button type="button" id="play-again" class="btn btn-primary">Play Again</button>
      <button type="button" id="change-diff" class="btn btn-secondary">Change Difficulty</button>
    </div>
  </div>
  <div id="tutorial-modal" class="overlay-screen hidden">
    <div class="panel" style="text-align:left;position:relative">
      <button type="button" id="close-tutorial" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#888">×</button>
      <div id="tutorial-content"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
        <button type="button" id="tut-prev" class="btn btn-secondary">Back</button>
        <span id="tut-dots"></span>
        <button type="button" id="tut-next" class="btn btn-primary">Next</button>
      </div>
    </div>
  </div>
  <div id="menu-modal" class="overlay-screen hidden">
    <div class="panel">
      <h2>Menu</h2>
      <button type="button" id="menu-new" class="btn btn-secondary" style="display:block;width:100%;margin:6px 0">New Game</button>
      <button type="button" id="menu-diff" class="btn btn-secondary" style="display:block;width:100%;margin:6px 0">Change Difficulty</button>
      <button type="button" id="menu-tutorial" class="btn btn-secondary" style="display:block;width:100%;margin:6px 0">Tutorial</button>
      <button type="button" id="menu-close" class="btn btn-primary" style="margin-top:10px">Close</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/KromaaWRLD/solitaire@b8f61cd2b274b7b3986c5dd72c758b44f499396a/game.js"></script>
  <script src="extras.js?v=13"></script>
</body>
</html>
