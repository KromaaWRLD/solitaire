<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klondike Solitaire</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>" />
</head>
<body>
  <!-- Start / Difficulty screen -->
  <div id="start-screen" class="overlay-screen">
    <div class="start-card">
      <h1>♠ Solitaire ♥</h1>
      <p class="subtitle">Klondike</p>
      <div class="difficulty-options">
        <button class="diff-btn" data-diff="easy">
          <span class="diff-name">Easy</span>
          <span class="diff-desc">Draw 1 · Unlimited passes</span>
        </button>
        <button class="diff-btn" data-diff="medium">
          <span class="diff-name">Medium</span>
          <span class="diff-desc">Draw 3 · Unlimited passes</span>
        </button>
        <button class="diff-btn" data-diff="hard">
          <span class="diff-name">Hard</span>
          <span class="diff-desc">Draw 3 · 3 passes only</span>
        </button>
      </div>
      <button id="open-tutorial-start" class="link-btn">How to play</button>
    </div>
  </div>

  <div class="app hidden" id="game-app">
    <header>
      <div class="header-left">
        <button id="menu-btn" class="icon-btn" title="Menu">☰</button>
        <h1>Solitaire</h1>
      </div>
      <div class="controls">
        <button id="pause-btn" class="icon-btn" title="Pause">⏸</button>
        <button id="undo" title="Undo" disabled>Undo</button>
        <button id="hint-btn" title="Hint">Hint</button>
        <button id="auto-btn" class="hidden" title="Finish the game">Finish</button>
        <div class="stats">
          <span id="timer">00:00</span>
          <span id="moves">0</span>
          <span id="score">0</span>
        </div>
      </div>
    </header>

    <main class="board">
      <div class="top-row">
        <div class="stock-waste">
          <div id="stock" class="pile stock" title="Draw"></div>
          <div id="waste" class="pile waste"></div>
        </div>
        <div class="foundations">
          <div id="foundation-0" class="pile foundation" data-suit="♠"></div>
          <div id="foundation-1" class="pile foundation" data-suit="♥"></div>
          <div id="foundation-2" class="pile foundation" data-suit="♦"></div>
          <div id="foundation-3" class="pile foundation" data-suit="♣"></div>
        </div>
      </div>
      <div class="tableau">
        <div id="tableau-0" class="pile tableau-col"></div>
        <div id="tableau-1" class="pile tableau-col"></div>
        <div id="tableau-2" class="pile tableau-col"></div>
        <div id="tableau-3" class="pile tableau-col"></div>
        <div id="tableau-4" class="pile tableau-col"></div>
        <div id="tableau-5" class="pile tableau-col"></div>
        <div id="tableau-6" class="pile tableau-col"></div>
      </div>
    </main>

    <div id="pass-info" class="pass-info hidden"></div>
  </div>

  <!-- Pause overlay -->
  <div id="pause-screen" class="overlay-screen hidden">
    <div class="pause-card">
      <h2>Paused</h2>
      <button id="resume-btn" class="primary-btn">Resume</button>
      <button id="new-from-pause" class="secondary-btn">New Game</button>
      <button id="tutorial-from-pause" class="link-btn">Tutorial</button>
    </div>
  </div>

  <!-- Win modal -->
  <div id="win-modal" class="overlay-screen hidden">
    <div class="modal-card win-card">
      <h2>You Win! 🎉</h2>
      <div id="win-stats" class="win-stats"></div>
      <button id="play-again" class="primary-btn">Play Again</button>
      <button id="change-diff" class="secondary-btn">Change Difficulty</button>
    </div>
  </div>

  <!-- Tutorial -->
  <div id="tutorial-modal" class="overlay-screen hidden">
    <div class="modal-card tutorial-card">
      <button id="close-tutorial" class="close-x">×</button>
      <div id="tutorial-content"></div>
      <div class="tutorial-nav">
        <button id="tut-prev" class="secondary-btn">Back</button>
        <span id="tut-dots"></span>
        <button id="tut-next" class="primary-btn">Next</button>
      </div>
    </div>
  </div>

  <!-- In-game menu -->
  <div id="menu-modal" class="overlay-screen hidden">
    <div class="modal-card menu-card">
      <h2>Menu</h2>
      <button id="menu-new" class="menu-item">New Game</button>
      <button id="menu-diff" class="menu-item">Change Difficulty</button>
      <button id="menu-tutorial" class="menu-item">Tutorial</button>
      <button id="menu-close" class="secondary-btn">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
